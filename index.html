<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPS Kickoff</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--frame:#fff;--panel:#312e2d;--ink:#fff;--yel:#ffd23f;--cyan:#3ddcff;--pink:#ff5c8a;--grn:#5cff9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--frame:#fff;--panel:#312e2d;--ink:#fff}}
:root[data-theme="dark"]{--bg:#000;--frame:#fff;--panel:#312e2d;--ink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Silkscreen,ui-monospace,Menlo,monospace;font-size:16px;line-height:1.5;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:24px 14px 48px}
.win{background:var(--frame);border:2px solid var(--panel);border-radius:8px;padding:8px}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--panel);font-size:13px;padding:2px 6px 8px}
.ctl{display:flex;gap:14px}
.panel{background:var(--panel);border-radius:6px;padding:28px 20px;min-height:380px}
h1{color:var(--yel);font-size:clamp(34px,11vw,56px);font-weight:400;text-align:center;margin:0 0 22px;line-height:1}
.pillw,.btn,.move{background:var(--ink);clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.pillw{padding:4px;margin-bottom:14px;background:var(--cyan)}
input{display:block;width:100%;font:inherit;color:var(--ink);background:var(--panel);border:0;padding:12px 16px;font-size:18px}
input:focus-visible{outline:3px dashed var(--ink);outline-offset:-8px}
.btn,.move{font:inherit;color:var(--panel);border:0;padding:14px 20px;cursor:pointer;font-size:18px;font-weight:700}
.btn{width:100%;background:var(--yel)}
.btn:hover:not(:disabled){background:#fff}
.move[data-m=rock]{background:var(--pink)}.move[data-m=paper]{background:var(--cyan)}.move[data-m=scissors]{background:var(--grn)}
.move:hover{filter:brightness(1.15)}
.btn:focus-visible,.move:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.info{text-align:center;margin:0 0 20px}
.lbl{font-size:13px;opacity:.75}
.big{color:var(--grn);font-size:clamp(30px,10vw,52px);line-height:1.15;margin:2px 0 14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;text-align:center;align-items:center;margin:14px 0;word-break:break-word}
.score{font-size:36px;color:var(--yel)}
.t{color:var(--yel)}
#tm{color:var(--cyan)}#tm.low{color:var(--pink)}
.msg.w{color:var(--grn)}.msg.l{color:var(--pink)}
.tbar{height:10px;background:#00000066;margin:10px 0 0}
.tbar i{display:block;height:100%;background:var(--cyan);animation:tb 7s linear forwards}
@keyframes tb{from{width:100%}to{width:0}}
.moves{display:flex;gap:10px;margin-top:16px}
.move{flex:1;padding:14px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px}
.msg{min-height:50px;margin-top:16px;text-align:center}
.c{text-align:center}
</style>
</head>
<body>
<main>
  <div class="win">
    <div class="bar"><span>RPS_KICKOFF.EXE</span><span class="ctl" id="ctl" aria-hidden="true"></span></div>
    <div class="panel" id="view"><p class="c">CONNECTING...</p></div>
  </div>
</main>
<script>
var BMP={
rock:["..####..",".######.","########","########","########","########",".######.","..####.."],
paper:["########","#......#","#.####.#","#......#","#.####.#","#......#","#.####.#","########"],
scissors:["#.....#.",".#...#..","..#.#...","...#....","..#.#...",".##.##..",".##.##..","..#.#..."],
min:["........","........","........","........","........","........","########","########"],
max:["########","########","#......#","#......#","#......#","#......#","#......#","########"],
x:["#......#",".#....#.","..#..#..","...##...","...##...","..#..#..",".#....#.","#......#"]};
function icon(m,px){var s='<svg width="'+8*px+'" height="'+8*px+'" viewBox="0 0 8 8" shape-rendering="crispEdges" fill="currentColor">';
 BMP[m].forEach(function(r,y){for(var x=0;x<8;x++)if(r[x]==="#")s+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'});return s+'</svg>'}
document.getElementById("ctl").innerHTML='<span style="color:#e0a800">'+icon("min",2)+'</span><span style="color:#1d9e5a">'+icon("max",2)+'</span><span style="color:#e0395f">'+icon("x",2)+'</span>';

var s=null,off=0,key="",id;
try{id=localStorage.getItem("rpsid")}catch(e){}
if(!id){id=(Math.random().toString(36)+Math.random().toString(36)).replace(/[^a-z0-9]/g,"").slice(0,24);try{localStorage.setItem("rpsid",id)}catch(e){}}
function $(i){return document.getElementById(i)}
function fmt(n){return n.toLocaleString("en-US")}
function now(){return Date.now()+off}
function sec(t){return Math.max(0,Math.ceil((t-now())/1000))}
function clock(t){var h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60;return(h?h+":":"")+(m<10?"0":"")+m+":"+(x<10?"0":"")+x}
function post(p,b){b.id=id;return fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).catch(function(){})}
var es=new EventSource("/events?id="+id);
es.onmessage=function(e){s=JSON.parse(e.data);off=s.now-Date.now();render()};
function rname(){var b=s.b,r=b.R-b.ri,g=b.kind==="final"?"FINAL · ":"GROUP "+b.idx+" · ";return g+(r===1?"FINAL ROUND":r===2?"SEMI-FINAL":r===3?"QUARTER-FINAL":"ROUND "+(b.ri+1)+" OF "+b.R)}
function msgOf(m){var L=m.last;if(!L)return["","PICK YOUR THROW."];
 if(!L.me&&!L.op)return["","NO ONE PICKED. THROW AGAIN."];
 if(L.r===0)return["","TIE. THROW AGAIN."];
 if(!L.me)return["l","TIME UP! POINT TO "+m.opp+"."];
 if(!L.op)return["w",m.opp+" TIMED OUT. POINT TO YOU!"];
 return L.r>0?["w",L.me.toUpperCase()+" BEATS "+L.op.toUpperCase()+". POINT TO YOU!"]:["l",L.op.toUpperCase()+" BEATS "+L.me.toUpperCase()+". POINT TO "+m.opp+"."]}
function screen(){var m=s.m,me=s.me,b=s.b;
 if(s.ph==="lobby"){
  if(!me)return["l0",'<h1>LOGIN</h1><div class="info" id="info"></div><div class="pillw"><input id="u" maxlength="12" autocomplete="off" placeholder="username" aria-label="username"></div><button class="btn" id="join">JOIN TOURNAMENT</button>'];
  return["l1",'<h1>YOU\'RE IN</h1><div class="info" id="info"></div><div class="c"><div class="lbl">YOUR PLAYER NUMBER</div><div class="big t">#'+me.num+'</div>WELCOME, '+me.name+'.<br>WAIT FOR THE START.</div>']}
 if(s.ph==="over"){var w=s.champMe;
  return["o"+(w?1:0),'<div class="c"><div class="lbl">'+(w?"YOU WIN":"CHAMPION")+'</div><div class="big">'+(w?"+"+fmt(s.pool)+"¢":s.champ)+'</div><p>'+(w?"THE WHOLE PRIZE POOL IS YOURS.":"PRIZE: "+fmt(s.pool)+"¢")+'<br>NEXT TOURNAMENT OPENS SOON.</p></div>']}
 var prog='<div class="lbl">GROUPS FINISHED '+s.hd+' OF '+s.H+'</div>';
 if(!me||!b)return["s"+s.hd,'<h1>LIVE</h1><div class="info"><div class="lbl">REGISTRATION IS CLOSED</div><div class="lbl">NEXT TOURNAMENT OPENS AFTER THIS ONE</div><div class="big">'+fmt(s.count)+'</div><div class="lbl">PLAYERS · PRIZE '+fmt(s.pool)+'¢</div>'+prog+'</div>'];
 if(me.out)return["x"+s.hd+"|"+me.out,'<div class="lbl c">YOU ARE OUT IN ROUND '+me.out+'</div><h1 style="margin-top:14px">OUT</h1><div class="info"><div class="lbl">PRIZE POOL</div><div class="big">'+fmt(s.pool)+'¢</div>'+prog+'</div>'];
 if(b.ph==="sched")return["k"+b.kind+b.idx,'<div class="lbl c">'+(b.kind==="final"?"YOU MADE THE FINAL!":"YOUR GROUP: #"+b.idx+" OF "+s.H)+'</div><h1 style="margin-top:14px">'+(b.kind==="final"?"FINAL":"SOON")+'</h1><div class="info"><div class="lbl">STARTS IN</div><div class="big t" id="st"></div><div class="lbl">YOUR SEAT #'+fmt(me.seat)+' · '+b.size+' PLAYERS</div><div class="lbl">STAY ON THIS PAGE</div></div>'];
 if(b.ph==="done")return["d"+s.hd,'<div class="lbl c">GROUP '+b.idx+' WON!</div><h1 style="margin-top:14px">WAIT</h1><div class="info"><div class="lbl">THE FINAL STARTS WHEN ALL GROUPS FINISH</div>'+prog+'</div>'];
 if(b.ph==="wait")return["w"+b.ri+b.kind,'<div class="lbl c">'+rname()+' COMPLETE</div><h1 style="margin-top:14px">WAIT</h1><div class="info"><div class="lbl">NEXT ROUND IN</div><div class="big t" id="wt"></div><div class="lbl">PLAYERS LEFT IN GROUP</div><div class="big">'+fmt(b.left)+'</div><div class="lbl">YOU ARE THROUGH · SEAT #'+fmt(me.seat)+'</div></div>'];
 if(m){var mm=msgOf(m);
  return["m"+b.ri+b.kind+"|"+m.th+"|"+m.moved+"|"+m.ys+"|"+m.ops,'<div class="lbl c">'+rname()+' · '+fmt(b.left)+' LEFT · BEST OF 5</div>'
  +'<div class="vs"><div>'+me.name+'<div class="lbl">SEAT #'+fmt(me.seat)+'</div></div><div class="score">'+m.ys+'-'+m.ops+'</div><div>'+m.opp+'<div class="lbl">SEAT #'+fmt(m.os)+'</div></div></div>'
  +'<div class="c">'+(m.moved?'WAITING FOR '+m.opp+'...':'PICK IN <span id="tm"></span>s OR LOSE THE POINT')+'</div><div class="tbar"><i id="bar" style="animation:none;width:100%"></i></div><div class="moves">'
  +["rock","paper","scissors"].map(function(x){return'<button class="move" data-m="'+x+'"'+(m.moved?' disabled':'')+'>'+icon(x,6)+x.toUpperCase()+'</button>'}).join("")
  +'</div><div class="msg '+mm[0]+'">'+mm[1]+'</div>']}
 return["a"+b.ri+b.kind,'<div class="lbl c">'+rname()+' · SEAT #'+fmt(me.seat)+'</div><div class="big c t" style="margin-top:20px">'+(s.bye?"BYE":"WAIT")+'</div><p class="c">'+(s.bye?"NO OPPONENT. YOU ADVANCE.":"YOUR MATCH IS DONE.")+'<br>WAITING FOR OTHER MATCHES.</p>']}
function paint(){if(!s)return;var e=$("info");
 if(e&&s.ph==="lobby")e.innerHTML=(s.startsAt?'<div class="lbl">REGISTRATION CLOSES IN</div><div class="big t">'+clock(sec(s.startsAt))+'</div>':'<div class="lbl">COUNTDOWN STARTS WHEN</div><div class="big t" style="font-size:22px">1ST PLAYER JOINS</div>')
  +'<div class="lbl">PRIZE POOL</div><div class="big">'+fmt(s.count)+'¢</div><div class="lbl">'+fmt(s.count)+' PLAYERS · +1¢ PER PLAYER · FREE ENTRY</div><div class="lbl">GROUPS OF '+s.hs+' · WINNERS MEET IN THE FINAL</div>';
 e=$("tm");if(e&&s.m){var t=sec(s.m.dl);e.textContent=t;e.className=t<=1?"low":""}
 e=$("bar");if(e&&s.m)e.style.width=Math.max(0,Math.min(100,(s.m.dl-now())/(s.tm/100)))+"%";
 e=$("wt");if(e)e.textContent=clock(sec(s.b.wu));
 e=$("st");if(e)e.textContent=clock(sec(s.b.sa))}
function render(){var sc=screen();if(sc[0]!==key){key=sc[0];$("view").innerHTML=sc[1];bind()}paint()}
var AC;
function sfx(m){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();var t=AC.currentTime;
 function env(g,t0,pk,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(pk,t0+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur)}
 function noise(t0,dur,type,f,pk){var n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  var src=AC.createBufferSource();src.buffer=b;var fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;var g=AC.createGain();env(g,t0,pk,dur);src.connect(fl);fl.connect(g);g.connect(AC.destination);src.start(t0)}
 function tone(t0,type,f0,f1,dur,pk){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);env(g,t0,pk,dur);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.02)}
 if(m==="paper"){noise(t,.14,"highpass",2500,.5);noise(t+.1,.18,"bandpass",4000,.4);noise(t+.22,.12,"highpass",3000,.25)}   // paper rustle
 else if(m==="rock"){tone(t,"sine",150,40,.22,1);noise(t,.08,"lowpass",500,.7)}                                       // rock thud
 else{[0,.13].forEach(function(o){noise(t+o,.07,"highpass",6000,.5);tone(t+o,"square",3300,2400,.06,.12);tone(t+o,"square",4700,3600,.06,.08)})} // scissors snip-snip
}catch(e){}}
function bind(){var j=$("join"),u=$("u");
 if(j)j.onclick=function(){post("/join",{name:u.value})};
 if(u)u.onkeydown=function(e){if(e.key==="Enter")j.click()};
 [].forEach.call(document.querySelectorAll(".move"),function(b){b.onclick=function(){sfx(b.dataset.m);post("/move",{move:b.dataset.m})}})}
setInterval(paint,150);
</script>
</body>
</html>
